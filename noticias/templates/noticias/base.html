{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Formula 1{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="https://city-png.b-cdn.net/preview/preview_public/uploads/preview/hd-f1-the-official-formula-1-transparent-png-701751712229525ajvwddtfme.png" type="image/png">

  <style>
    :root{
      --ferrari-red: #C4002A;
      --ferrari-dark: #8b001e;
      --ferrari-accent: #ffce00;
    }
    .navbar {
      background-color: var(--ferrari-red) !important;
      border-bottom: 4px solid var(--ferrari-accent);
    }
    .navbar .navbar-brand {
      color: #fff !important;
      font-weight: 700;
      letter-spacing: .6px;
      display: inline-flex;
      align-items: center;
    }
    .brand-logo {
      height: 30px;
      width: auto;
      margin-right: 10px;
      border-radius: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    @media (max-width:576px){ .brand-logo{height:22px} }
    body { background: linear-gradient(180deg,#fff 0%, #fff6f6 100%); }
    .noticia-card { border-radius: 12px; overflow: hidden; transition: transform .25s ease, box-shadow .25s ease; border: 1px solid rgba(0,0,0,0.06); }
    .noticia-card::before{ content: ""; display:block; height:6px; background: var(--ferrari-red); }
    .noticia-card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(196,0,42,0.15); }
    .img-cover { width:100%; height:100%; object-fit:cover; }
    .btn-ferrari { background: var(--ferrari-red); border-color: var(--ferrari-red); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(196,0,42,0.18); transition: transform .12s ease, filter .12s ease; }
    .btn-ferrari:hover, .btn-ferrari:focus { background: var(--ferrari-dark); border-color: var(--ferrari-dark); transform: translateY(-2px); filter: brightness(1.02); color: #fff; }
    h2, .card-title { color: #1b1b1b; }
    .text-muted { color: #6c6c6c !important; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">
        
        <img src="https://logos-world.net/wp-content/uploads/2020/07/Ferrari-Scuderia-Logo.png" alt="Ferrari" class="brand-logo">
        Noticias F1
      </a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
